[workspace]
resolver = "2"
members = [
    "helios-core",
    "helios-parser",
    "helios-detector",
    "helios-ingest",
    "helios-enrichment",
    "helios-storage",
    "helios-api",
    "helios-cli",
    "parsers/helios-parser-syslog",
    "parsers/helios-parser-apache",
    "parsers/helios-parser-nginx",
    "parsers/helios-parser-json",
    "parsers/helios-parser-cef",
    "parsers/helios-parser-leef",
    "parsers/helios-parser-evtx",
    "parsers/helios-parser-zookeeper",
    "parsers/helios-parser-spark",
    "parsers/helios-parser-windows",
    "parsers/helios-parser-android",
    "parsers/helios-parser-openssh",
    "parsers/helios-parser-proxifier",
]

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tower-http = { version = "0.5", features = ["cors"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
